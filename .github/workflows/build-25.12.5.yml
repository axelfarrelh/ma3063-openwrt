name: Build OpenWrt 25.12.5 for RG-MA3063

on:
  workflow_dispatch:
  push:
    branches: [port/openwrt-25.12.5]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MA3063 port
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git             libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget ccache

      - name: Build OpenWrt 25.12.5
        run: bash src/25.12.5/build-25.12.5.sh

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.5-ma3063
          path: openwrt/bin/targets/qualcommax/ipq50xx/*
          if-no-files-found: warn
